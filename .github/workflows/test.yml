name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # Keep every run on main so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  group: ${{ case(github.ref == 'refs/heads/main', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.settings.name }})
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
          - name: windows
            host: windows-latest
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Build bridge artifact
        run: bun run --cwd packages/halext-bridge build

      - name: Smoke bridge artifact
        run: >-
          bun --cwd packages/halext-bridge -e
          'process.env.AFS_BIN = "node";
          process.env.AFS_CLI = "node";
          const { runAfsJson } = await import("./dist/server.js");
          const value = await runAfsJson(["-e", "console.log(JSON.stringify({ ok: true }))"], { timeoutMs: 10_000 });
          if (value.ok !== true) process.exit(1)'

      - name: Run unit tests
        # GitHub-hosted runners are smaller than the fork's former Blacksmith
        # workers. Serializing package tasks prevents unrelated suites from
        # starving Bun's per-test timeout while retaining each package's own
        # test parallelism.
        # Stream task output so a stalled package remains diagnosable instead
        # of withholding its logs until the task exits.
        run: bun turbo test --concurrency=1 --log-order=stream

  e2e:
    name: e2e (${{ matrix.settings.name }})
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        settings:
          - name: linux
            host: ubuntu-latest
            playwright: bunx playwright install --with-deps
          - name: windows
            host: windows-latest
            playwright: bunx playwright install
    runs-on: ${{ matrix.settings.host }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: 0
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Install Playwright browsers
        working-directory: packages/app
        run: ${{ matrix.settings.playwright }}

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
          # Five browser workers overloaded the smaller hosted runner and
          # starved navigation/model assertions past their 10s expect budget.
          PLAYWRIGHT_WORKERS: 2
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.settings.name }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
